global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "fastapi"
    static_configs:
      - targets:
          - "app:8080"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
  
  - job_name: "vllm"
    static_configs:
      - targets:
          - "vllm:8000"